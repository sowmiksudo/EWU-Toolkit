<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Offline - EWU-Toolkit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #F8FAFC;
            color: #0F172A;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            background: #FFFFFF;
            padding: 36px 28px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            border: 1px solid #E2E8F0;
        }
        .icon-circle {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: #EFF6FF;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #2563EB;
        }
        .icon-circle svg {
            width: 40px;
            height: 40px;
            fill: currentColor;
        }
        h1 {
            font-size: 22px;
            font-weight: 700;
            color: #003366;
            margin-bottom: 12px;
        }
        p {
            font-size: 14px;
            line-height: 1.6;
            color: #64748B;
            margin-bottom: 28px;
        }
        .btn-retry {
            display: inline-block;
            width: 100%;
            background-color: #003366;
            color: #FFFFFF;
            border: none;
            padding: 14px 24px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 51, 102, 0.2);
        }
        .btn-retry:active {
            background-color: #002244;
            transform: scale(0.98);
        }
        .hint {
            margin-top: 18px;
            font-size: 12px;
            color: #94A3B8;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon-circle">
            <svg viewBox="0 0 24 24">
                <path d="M23.64 7c-.45-.34-4.93-4-11.64-4-1.5 0-2.8.19-3.95.47l4.45 4.45c.33-.05.66-.07 1-.07 5.06 0 8.78 2.71 9.17 3.02L23.64 7zM3.41 1.86L2 3.27l2.28 2.28C2.58 6.83 2 7.39 1.95 7.43l9.55 11.88.5.62.5-.62 4.19-5.21 3.54 3.54 1.41-1.41L3.41 1.86zM12 17.43L4.69 8.34C5.77 7.63 7.82 6.5 10.42 6.2L17.58 13.36 12 17.43z"/>
            </svg>
        </div>
        <h1>You're Offline</h1>
        <p>Could not connect to East West University portal. Please check your internet or Wi-Fi connection and try again.</p>
        <button class="btn-retry" onclick="location.reload()">Try Again</button>
        <div class="hint">You can also pull down from the top to refresh.</div>
    </div>
</body>
</html>
